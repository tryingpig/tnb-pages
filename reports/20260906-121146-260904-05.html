<title>TNBfolio 해외 뉴스 대시보드 (2026-09-05)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #F7F6F2;
  --surface: #FFFFFF;
  --sub-surface: #F0EEE9;
  --text-main: #1A1A18;
  --text-sub: #6B6B67;
  --text-muted: #ABABAB;
  --accent-green: #0B7A55;
  --accent-green-bg: #E1F5EE;
  --accent-red: #C93232;
  --accent-red-bg: #FAECEC;
  --accent-gold: #9A6E00;
  --accent-gold-bg: #FFF3D0;
  --accent-blue: #185FA5;
  --accent-blue-bg: #E6F1FB;
  --accent-purple: #3C3489;
  --accent-purple-bg: #EEEDFE;
  --accent-pink: #993556;
  --accent-pink-bg: #FDE8EF;
  --accent-darkgreen: #3B6D11;
  --accent-darkgreen-bg: #EAF5DF;
  --accent-gray: #5F5E5A;
  --accent-gray-bg: #ECEBE8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg);
  color: var(--text-main);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.serif { font-family: 'DM Serif Display', Georgia, serif; }

header {
  background-color: #1A1A18;
  color: #FFFFFF;
  padding: 32px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.header-left .eyebrow {
  font-size: 13px;
  color: #A0A09B;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
}
.header-left h1 {
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.5px;
  color: #FFFFFF;
}
.header-left .meta {
  margin-top: 8px;
  font-size: 14px;
  color: #8E8E89;
}
.btn-download {
  background-color: var(--accent-green);
  color: #FFFFFF;
  border: none;
  padding: 12px 22px;
  border-radius: 6px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: opacity 0.2s ease;
}
.btn-download:hover { opacity: 0.9; }

.kpi-strip {
  background-color: var(--surface);
  border-bottom: 1px solid #E2E0D8;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.kpi-cell {
  padding: 24px 32px;
  border-right: 1px solid #E2E0D8;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.kpi-cell:last-child { border-right: none; }
.kpi-num {
  font-size: 30px;
  color: var(--text-main);
}
.kpi-label {
  font-size: 12px;
  color: var(--text-sub);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.kpi-badge {
  display: inline-block;
  align-self: flex-start;
  margin-top: 6px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

.main-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: calc(100vh - 250px);
}

aside {
  background-color: var(--surface);
  border-right: 1px solid #E2E0D8;
  padding: 24px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}
.sidebar-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 12px;
  padding-left: 8px;
}
.filter-btn {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 12px;
  border: none;
  background: transparent;
  color: var(--text-main);
  font-size: 14px;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 2px;
  transition: all 0.15s ease;
  border-left: 3px solid transparent;
}
.filter-btn:hover {
  background-color: var(--sub-surface);
}
.filter-btn.active {
  background-color: var(--accent-green-bg);
  color: var(--accent-green);
  border-left-color: var(--accent-green);
  font-weight: 600;
}
.filter-btn .count-badge {
  background-color: #E2E0D8;
  color: var(--text-sub);
  padding: 2px 7px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
}
.filter-btn.active .count-badge {
  background-color: var(--accent-green);
  color: #FFFFFF;
}
.sidebar-divider {
  height: 1px;
  background-color: #E2E0D8;
  margin: 16px 0;
}
.mini-bar-row {
  margin-bottom: 10px;
  padding: 0 8px;
}
.mini-bar-header {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 4px;
}
.mini-bar-track {
  height: 6px;
  background-color: var(--sub-surface);
  border-radius: 3px;
  overflow: hidden;
}
.mini-bar-fill {
  height: 100%;
  border-radius: 3px;
}

main {
  padding: 36px 40px;
  overflow-x: hidden;
}

.charts-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 40px;
}
.chart-box {
  background-color: var(--surface);
  border: 1px solid #E2E0D8;
  border-radius: 8px;
  padding: 24px;
}
.chart-box h3 {
  font-size: 16px;
  margin-bottom: 18px;
  color: var(--text-main);
  border-bottom: 1px solid #E2E0D8;
  padding-bottom: 10px;
}
.bar-chart-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
}
.bar-chart-label {
  width: 90px;
  color: var(--text-sub);
  flex-shrink: 0;
}
.bar-chart-bar-wrap {
  flex: 1;
  background-color: var(--sub-surface);
  height: 14px;
  border-radius: 3px;
  overflow: hidden;
  margin: 0 10px;
}
.bar-chart-bar {
  height: 100%;
  border-radius: 3px;
}
.bar-chart-val {
  width: 24px;
  text-align: right;
  font-weight: 600;
  color: var(--text-sub);
}

.sector-section {
  margin-bottom: 48px;
}
.sector-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-bottom: 2px solid #1A1A18;
  padding-bottom: 10px;
  margin-bottom: 20px;
}
.sector-header h2 {
  font-size: 20px;
  font-weight: 400;
}
.sector-header .count {
  font-size: 14px;
  color: var(--text-sub);
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.card {
  background-color: var(--surface);
  border: 1px solid #E2E0D8;
  border-radius: 8px;
  padding: 18px 20px;
  position: relative;
  border-left-width: 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover {
  border-color: #A0A09B;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  transform: translateY(-2px);
}
.card-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.card-num {
  font-size: 20px;
  color: #ABABAB;
  line-height: 1;
  flex-shrink: 0;
  width: 26px;
}
.card-title-wrap {
  flex: 1;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text-main);
  margin-bottom: 6px;
}
.tag-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 4px;
}
.card-summary {
  font-size: 13px;
  color: #4A4A46;
  line-height: 1.55;
  margin-bottom: 16px;
  flex: 1;
}
.card-summary ul {
  list-style: none;
}
.card-summary li {
  position: relative;
  padding-left: 14px;
  margin-bottom: 5px;
}
.card-summary li::before {
  content: "•";
  position: absolute;
  left: 2px;
  color: #ABABAB;
}
.card-summary li:last-child { margin-bottom: 0; }
.card-bottom {
  border-top: 1px solid #EFEFEA;
  padding-top: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
}
.card-domain {
  color: var(--text-muted);
}
.card-link {
  color: var(--accent-green);
  text-decoration: none;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.card-link:hover { text-decoration: underline; }

footer {
  background-color: #1A1A18;
  color: #A0A09B;
  padding: 24px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  border-top: 1px solid #333330;
}

@media (max-width: 900px) {
  .kpi-strip { grid-template-columns: repeat(2, 1fr); }
  .charts-row { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .main-layout { grid-template-columns: 1fr; }
  aside { display: none; }
  main { padding: 24px 16px; }
  header { padding: 24px 16px; }
  .cards-grid { grid-template-columns: 1fr; }
  footer { flex-direction: column; gap: 8px; text-align: center; }
}
</style>
<style id="tnb-mobile">
@media (max-width: 640px) {
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0 !important; min-width: 0 !important;
    max-width: 100% !important; overflow-x: hidden !important; }
  body { width: auto !important; padding: 14px !important;
    box-sizing: border-box !important; font-size: 16px !important; line-height: 1.65 !important; }
  /* 넘침 방지 (자식이 화면 밖으로 못 나감) */
  body * { max-width: 100% !important; box-sizing: border-box !important; }
  /* 고정폭 컨테이너만 유동화 (이미 반응형인 flex/row 등은 건드리지 않음) */
  [class*="container"], [class*="wrapper"], [class*="wrap"],
  main, header, section, article, footer { width: auto !important; min-width: 0 !important; }
  /* 다단 그리드 → 세로 스택 (그리드에 한함) */
  [style*="grid-template-columns"], [class*="grid"] {
    display: block !important; grid-template-columns: 1fr !important; }
  /* 이미지/미디어 반응형 */
  img, svg, canvas, video, iframe { max-width: 100% !important; height: auto !important; }
  /* 넓은 표는 가로 스크롤 허용(찌그러짐 방지) */
  table { display: block !important; width: 100% !important; overflow-x: auto !important;
    -webkit-overflow-scrolling: touch; }
}
</style>

function getBadge(title, sector) {
  const t = title.toLowerCase();
  if (t.includes('ai') || t.includes('인공지능') || t.includes('llm')) return { text: 'AI', color: '#185FA5', bg: '#E6F1FB' };
  if (t.includes('로봇') || t.includes('휴머노이드')) return { text: '로봇', color: '#0B7A55', bg: '#E1F5EE' };
  if (t.includes('반도체') || t.includes('hbm') || t.includes('dram') || t.includes('메모리') || t.includes('낸드') || t.includes('웨이퍼') || t.includes('cxl')) {
    let kw = '반도체';
    if (t.includes('hbm')) kw = 'HBM';
    else if (t.includes('dram')) kw = 'DRAM';
    else if (t.includes('낸드')) kw = 'NAND';
    else if (t.includes('cxl')) kw = 'CXL';
    return { text: kw, color: '#185FA5', bg: '#E6F1FB' };
  }
  if (t.includes('하락') || t.includes('폭락') || t.includes('급락') || t.includes('경고') || t.includes('위기') || t.includes('인플레이션') || t.includes('적자')) return { text: '경고', color: '#C93232', bg: '#FAECEC' };
  if (t.includes('ipo') || t.includes('상장')) return { text: 'IPO', color: '#9A6E00', bg: '#FFF3D0' };
  if (t.includes('투자') || t.includes('펀드') || t.includes('계약') || t.includes('수출') || t.includes('실적') || t.includes('승인')) return { text: '투자·계약', color: '#0B7A55', bg: '#E1F5EE' };
  if (t.includes('원자력') || t.includes('smr')) return { text: '원자력', color: '#3B6D11', bg: '#EAF5DF' };
  if (t.includes('배터리') || t.includes('ev') || t.includes('전기차')) return { text: '배터리·EV', color: '#0B7A55', bg: '#E1F5EE' };
  if (t.includes('디젤') || t.includes('유가') || t.includes('원유') || t.includes('호르무즈')) return { text: '에너지', color: '#5F5E5A', bg: '#ECEBE8' };
  if (t.includes('지정학') || t.includes('전쟁') || t.includes('군사') || t.includes('이란') || t.includes('휴전')) return { text: '지정학', color: '#C93232', bg: '#FAECEC' };
  return { text: sector, color: '#5F5E5A', bg: '#ECEBE8' };
}

function getDomain(url) {
  try {
    const parsed = new URL(url);
    return parsed.hostname.replace(/^www\./, '');
  } catch (e) {
    return 'link';
  }
}

function renderContent(filter = 'all') {
  const container = document.getElementById('newsContent');
  container.innerHTML = '';
  
  const filtered = filter === 'all' ? rawData : rawData.filter(s => s.sector === filter);
  
  filtered.forEach(sec => {
    const secWrap = document.createElement('div');
    secWrap.className = 'sector-section';
    
    secWrap.innerHTML = `
      <div class="sector-header">
        <span>${sec.icon}</span>
        <h2 class="serif" style="color:${sec.color}">${sec.sector}</h2>
        <span class="count">${sec.items.length}건</span>
      </div>
      <div class="cards-grid">
        ${sec.items.map(item => {
          const badge = getBadge(item.title, sec.sector);
          const domain = getDomain(item.url);
          return `
            <div class="card" style="border-left-color:${sec.color}">
              <div>
                <div class="card-top">
                  <div class="card-num serif">${item.num}</div>
                  <div class="card-title-wrap">
                    <div class="card-title">${item.title}</div>
                    <span class="tag-badge" style="background:${badge.bg};color:${badge.color}">${badge.text}</span>
                  </div>
                </div>
                <div class="card-summary">
                  <ul>
                    ${item.summary.map(s => `<li>${s}</li>`).join('')}
                  </ul>
                </div>
              </div>
              <div class="card-bottom">
                <span class="card-domain">${domain}</span>
                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="card-link">원문 →</a>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
    container.appendChild(secWrap);
  });

  const chartsRow = document.getElementById('chartsRow');
  if (filter === 'all') {
    chartsRow.style.display = 'grid';
  } else {
    chartsRow.style.display = 'none';
  }
}

function renderSidebarMiniBars() {
  const container = document.getElementById('miniBarContainer');
  container.innerHTML = '';
  const maxCount = Math.max(...rawData.map(s => s.items.length));
  
  rawData.forEach(s => {
    const pct = (s.items.length / maxCount) * 100;
    const row = document.createElement('div');
    row.className = 'mini-bar-row';
    row.innerHTML = `
      <div class="mini-bar-header">
        <span>${s.sector}</span>
        <span>${s.items.length}</span>
      </div>
      <div class="mini-bar-track">
        <div class="mini-bar-fill" style="width:${pct}%;background-color:${s.color}"></div>
      </div>
    `;
    container.appendChild(row);
  });
}

function renderSectorBarChart() {
  const container = document.getElementById('sectorBarChart');
  container.innerHTML = '';
  const maxVal = Math.max(...rawData.map(s => s.items.length));
  
  rawData.forEach(s => {
    const row = document.createElement('div');
    row.className = 'bar-chart-row';
    const pct = (s.items.length / maxVal) * 100;
    row.innerHTML = `
      <div class="bar-chart-label">${s.sector}</div>
      <div class="bar-chart-bar-wrap">
        <div class="bar-chart-bar" style="width:${pct}%;background-color:${s.color}"></div>
      </div>
      <div class="bar-chart-val">${s.items.length}</div>
    `;
    container.appendChild(row);
  });
}

function initTechDoughnut() {
  const ctx = document.getElementById('techDoughnutChart').getContext('2d');
  const techItems = rawData.find(s => s.sector === '기술주').items;
  
  let hbmMemCount = 0;
  let aiModelsCount = 0;
  let ipoFundCount = 0;
  let equipPackCount = 0;
  let otherTechCount = 0;

  techItems.forEach(item => {
    const t = item.title.toLowerCase();
    if (t.includes('hbm') || t.includes('dram') || t.includes('낸드') || t.includes('cxl') || t.includes('메모리')) {
      hbmMemCount++;
    } else if (t.includes('모델') || t.includes('에이전트') || (t.includes('openai') && !t.includes('상장'))) {
      aiModelsCount++;
    } else if (t.includes('ipo') || t.includes('상장') || t.includes('펀딩') || t.includes('투자')) {
      ipoFundCount++;
    } else if (t.includes('패키징') || t.includes('euv') || t.includes('웨이퍼') || t.includes('가스') || t.includes('레이저') || t.includes('테스트')) {
      equipPackCount++;
    } else {
      otherTechCount++;
    }
  });

  new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['메모리·HBM', '장비·패키징', 'AI모델·에이전트', '투자·IPO', '기타 디바이스'],
      datasets: [{
        data: [hbmMemCount, equipPackCount, aiModelsCount, ipoFundCount, otherTechCount],
        backgroundColor: ['#185FA5', '#0B7A55', '#3C3489', '#9A6E00', '#6B6B67'],
        borderWidth: 2,
        borderColor: '#FFFFFF'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          position: 'right',
          labels: { boxWidth: 12, font: { family: 'DM Sans', size: 11 } }
        }
      },
      cutout: '65%'
    }
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.getAttribute('data-filter');
    renderContent(filter);
  });
});
