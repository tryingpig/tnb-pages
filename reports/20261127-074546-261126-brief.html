  "head": "한국은행, 기준금리 [[25bp]] 인상해 연 [[3.25%]]",
  "desc": "황건일·이수형 두 금통위원이 반대했다. 인플레이션 압력이 상당 기간 목표치 위에 머물 것으로 보고, 추가 인상 시기는 물가·내수·금융 안정에 따라 정한다고 밝혔다."
 },
 {

 },
 {
  "tag": "HAWKISH · BOJ",
  "color": "#9A7B2F",
  "head": "다무라 위원, 중립금리 약 [[2%]]로 조속히 조정해야",
  "desc": "수개월 간격 [[25bp]] 인상 가능성을 언급했고, 인플레이션 위험이 심화되면 [[50bp]] 인상 등 속도를 높일 필요가 있다고 했다."
 },
 {

 },
 {

  "color": "#1B2A4A",

  "desc": "EU는 [[15%]] 관세 합의 존중을 요구했고, 중국 상무부는 301조 조사를 일방주의 행위로 규정했다. 일본과 싱가포르도 유감과 반대를 표명했다."

const TAGC = {"HAWKISH":"#C8392B","RATE HIKE":"#C8392B","GEO RISK":"#C8392B","SHIPPING RISK":"#C8392B","TARIFF PUSHBACK":"#C8392B","RISK WARNING":"#C8392B","EXPORT CONTROL":"#C8392B",
  "DOVISH":"#2E7D52","RATE CUT":"#2E7D52","BULLISH":"#2E7D52","NEUTRAL":"#1A5C9E","RATING AFFIRMED":"#1A5C9E"};

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s).replace(/\[\[(.+?)\]\]/g,'<span class="num">$1</span>');
const pad = n => String(n).padStart(2,"0");
const isKR = s => /[가-힣]/.test(s);

const total = CATS.reduce((a,c)=>a+c.speakers.length,0);
document.getElementById("meta").innerHTML =
  `<div class="big">${DATE}</div>
   <div>CATEGORIES · <b>${CATS.map(c=>c.ko).join(" / ")}</b></div>
   <div>SPEAKERS · <b>${total}</b> 발언자·기관</div>`;

document.getElementById("take").innerHTML = TAKE.map(t=>
  `<article class="tcard" style="--c:${t.color}"><div class="tg">${esc(t.tag)}</div><h3>${fmt(t.head)}</h3><p>${fmt(t.desc)}</p></article>`).join("");

const chips = document.getElementById("chips");
chips.innerHTML = `<button class="chip on" data-k="all" style="--c:#1B2A4A"><span class="dot"></span>전체<span class="n">${total}</span></button>` +
  CATS.map(c=>`<button class="chip" data-k="${c.key}" style="--c:${c.color}"><span class="dot"></span>${c.ko}<span class="n">${c.speakers.length}</span></button>`).join("");

document.getElementById("cats").innerHTML = CATS.map((c,ci)=>`
  <section class="cat" id="cat-${c.key}" data-k="${c.key}" style="--c:${c.color}">
    <div class="cat-head"><span class="no">${pad(ci+1)}</span><span class="ko">${c.ko}</span><span class="en">${c.en}</span><span class="cnt">${c.speakers.length} SPEAKERS</span></div>
    ${c.speakers.map((s,si)=>`
      <article class="spk">
        <div class="id">
          <div class="ix">${pad(ci+1)}-${pad(si+1)}</div>
          <div class="en${isKR(s.en)?" kr":""}">${esc(s.en)}</div>
          <div class="ko${isKR(s.ko)?"":" lat"}">${esc(s.ko)}</div>
          <div class="role">${esc(s.role)}</div>
          ${s.tags.length?`<div class="tags">${s.tags.map(t=>`<span class="tag" style="--tc:${TAGC[t]||"#1A5C9E"}">${t}</span>`).join("")}</div>`:""}
        </div>
        <div class="body">
          ${s.blocks.map(b=>`<div class="blk"><h4><span>${esc(b.title)}</span></h4><ul>${
            b.items.map(it=>{const k=it.startsWith("*");return `<li${k?' class="key"':""}>${fmt(k?it.slice(1):it)}</li>`;}).join("")
          }</ul></div>`).join("")}
        </div>
      </article>`).join("")}
  </section>`).join("");

chips.addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  chips.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on", x===b));
  const k = b.dataset.k;
  document.querySelectorAll(".cat").forEach(s=>s.classList.toggle("hide", k!=="all" && s.dataset.k!==k));
  const top = chips.closest(".filters").offsetTop;
  if (window.scrollY > top) window.scrollTo({top, behavior:"smooth"});
});
</script>
</body>
</html>
