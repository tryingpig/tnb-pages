      const counts = {};
      Object.keys(SECTORS_DATA).forEach(s => counts[s] = 0);
      NEWS_ITEMS.forEach(item => {
        counts[item.sector] = (counts[item.sector] || 0) + 1;
      });

      // 사이드바 버튼 & 미니 바
      const filterBtnContainer = document.getElementById('filterButtonList');
      const miniChartContainer = document.getElementById('miniChartList');
      const barDistList = document.getElementById('barDistList');

      filterBtnContainer.innerHTML = '';
      miniChartContainer.innerHTML = '';
      barDistList.innerHTML = '';

      const maxCount = Math.max(...Object.values(counts));

      Object.entries(counts).forEach(([sec, cnt]) => {
        const secMeta = SECTORS_DATA[sec];
        // Filter button
        const btn = document.createElement('button');
        btn.className = `filter-btn filter-sec-${sec}`;
        btn.onclick = () => filterSector(sec);
        btn.innerHTML = `<span>${secMeta.emoji} ${sec}</span><span class="filter-count">${cnt}</span>`;
        filterBtnContainer.appendChild(btn);

        // Sidebar Mini chart
        const pct = ((cnt / maxCount) * 100).toFixed(0);
        const row = document.createElement('div');
        row.className = 'mini-chart-row';
        row.innerHTML = `
          <span class="mini-chart-label">${sec}</span>
          <div class="mini-chart-track">
            <div class="mini-chart-fill" style="width:${pct}%; background-color:${secMeta.color};"></div>
          </div>
          <span class="mini-chart-val">${cnt}</span>
        `;
        miniChartContainer.appendChild(row);

        // Distribution list
        const distRow = document.createElement('div');
        distRow.className = 'bar-dist-row';
        const distPct = ((cnt / NEWS_ITEMS.length) * 100).toFixed(1);
        distRow.innerHTML = `
          <span>${secMeta.emoji} ${sec}</span>
          <div class="bar-dist-track">
            <div class="bar-dist-fill" style="width:${(cnt / maxCount) * 100}%; background-color:${secMeta.color};"></div>
          </div>
          <span style="font-weight:600; text-align:right;">${cnt}건</span>
        `;
        barDistList.appendChild(distRow);
      });

      renderTechChart();
      renderNewsSections();
    }

    function renderTechChart() {
      const ctx = document.getElementById('techDoughnutChart');
      if (!ctx) return;
      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['반도체 및 부품 (MLCC/NAND)', 'AI 인프라 및 컴퓨팅', '프론티어 모델 및 SW', '디스플레이 및 기구'],
          datasets: [{
            data: [9, 5, 4, 2],
            backgroundColor: ['#185FA5', '#0B7A55', '#3C3489', '#9A6E00'],
            borderWidth: 2,
            borderColor: '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                boxWidth: 10,
                font: { size: 11, family: 'DM Sans' }
              }
            }
          },
          cutout: '65%'
        }
      });
    }

    function renderNewsSections() {
      const container = document.getElementById('newsSectionsContainer');
      container.innerHTML = '';

      const sectorsToDisplay = activeFilter === 'ALL' 
        ? Object.keys(SECTORS_DATA)
        : [activeFilter];

      sectorsToDisplay.forEach(sec => {
        const secItems = NEWS_ITEMS.filter(it => it.sector === sec);
        if (secItems.length === 0) return;

        const secMeta = SECTORS_DATA[sec];
        const sectionEl = document.createElement('section');
        sectionEl.className = 'sector-section';

        const headerEl = document.createElement('div');
        headerEl.className = 'sector-header';
        headerEl.innerHTML = `
          <div class="sector-title">${secMeta.emoji} ${sec}</div>
          <div class="sector-badge-count">총 ${secItems.length}건</div>
        `;
        sectionEl.appendChild(headerEl);

        const gridEl = document.createElement('div');
        gridEl.className = 'news-grid';

        secItems.forEach(item => {
          const badge = getBadge(item.title, item.sector);
          const domain = getDomain(item.url);
          const card = document.createElement('article');
          card.className = 'news-card';
          card.innerHTML = `
            <div class="card-accent-bar" style="background-color:${secMeta.color};"></div>
            <div class="card-top">
              <div class="card-idx-tag">
                <span class="card-idx">#${String(item.idx).padStart(2, '0')}</span>
                <span class="card-badge" style="background:${badge.bg}; color:${badge.color};">${badge.label}</span>
              </div>
              <h2 class="card-title">${item.title}</h2>
            </div>
            <div class="card-summary">
              <p>${item.summary[0]}</p>
              <p>${item.summary[1]}</p>
              <p>${item.summary[2]}</p>
            </div>
            <div class="card-bottom">
              <span class="domain-tag">${domain}</span>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="link-btn">원문 →</a>
            </div>
          `;
          gridEl.appendChild(card);
        });

        sectionEl.appendChild(gridEl);
        container.appendChild(sectionEl);
      });
    }

    function filterSector(sec) {
      activeFilter = sec;
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(b => b.classList.remove('active'));

      if (sec === 'ALL') {
        buttons[0].classList.add('active');
        document.getElementById('chartsRow').style.display = 'grid';
      } else {
        const targetBtn = document.querySelector(`.filter-sec-${sec}`);
        if (targetBtn) targetBtn.classList.add('active');
        document.getElementById('chartsRow').style.display = 'none';
      }
      renderNewsSections();
    }

    function downloadCurrentHTML() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "TNBfolio_뉴스대시보드_20260923.html";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    
  </script>
</body>
</html>
