<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10월 12일 장 마감 전 뉴스 히트맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#fff;--ink:#141c26;--sub:#4b5563;--muted:#8a94a3;--line:#e5e7eb;--soft:#f3f4f6;--blue:#0f69ff;--blue-bg:#eaf2ff;
  --up:#13a688;--down:#d6203a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 40px}
button{font-family:inherit}

/* header */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--blue)}
h1{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
h1 span{color:var(--muted);font-weight:600;font-size:15px;margin-left:6px}
.dl{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--sub)}
.dl:hover{background:var(--soft)}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:none;padding:10px 14px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;border-radius:8px 8px 0 0}
.tab:hover{background:var(--soft)}
.tab.on{color:var(--blue);background:var(--blue-bg)}
.tab .c{font-size:12px;color:var(--muted);margin-left:4px;font-weight:600}

/* toolbar */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--blue-bg);color:var(--blue)}
.scale{display:flex;flex-direction:column;gap:3px}
.scale .sw{display:flex;border-radius:3px;overflow:hidden}
.scale .sw i{width:44px;height:12px}
.scale .lb{display:flex;font-size:11px;color:var(--sub)}
.scale .lb span{width:44px;text-align:center}
.scale .cap{display:flex;justify-content:space-between;font-size:11px;font-weight:700}
.scale .cap b:first-child{color:var(--down)} .scale .cap b:last-child{color:var(--up)}

/* heatmap */
.map{position:relative;width:100%;height:640px;border-radius:8px;overflow:hidden;background:#fff}
.tile{position:absolute;border:1px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;cursor:pointer;overflow:hidden;color:#10202b;transition:filter .12s}
.tile:hover{filter:brightness(.93);z-index:2;outline:2px solid #10202b;outline-offset:-2px}
.tile .k{font-weight:800;line-height:1.15;letter-spacing:-.3px}
.tile .v{font-weight:500;margin-top:.25em;line-height:1.1}
.tile .t{font-weight:500;margin-top:.55em;line-height:1.35;opacity:.85;max-width:92%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ai{position:absolute;top:6px;right:7px;font-size:10px;font-weight:800;border:1.5px solid currentColor;border-radius:4px;padding:0 4px;opacity:.6}
.note{font-size:12px;color:var(--muted);margin-top:10px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--sub);font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
.tbl td{padding:12px 8px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:#fafafa}
.tbl .k{font-weight:800}
.tbl .hl{color:var(--sub);font-size:13px}
.pill{display:inline-block;min-width:56px;text-align:center;padding:3px 8px;border-radius:6px;font-weight:700;font-size:13px}
.hide-m{}
@media (max-width:720px){.hide-m{display:none}.map{height:820px}.scale .sw i,.scale .lb span{width:28px}}

/* drawer */
.dim{position:fixed;inset:0;background:rgba(15,23,32,.35);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:#fff;z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
.drawer:not(.on){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.drawer.on{transform:none}
@media (max-width:720px){.drawer{top:auto;bottom:0;height:86%;width:100%;border-radius:18px 18px 0 0;transform:translateY(100%)}}
.d-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.d-nav{display:flex;gap:6px}
.d-nav button,.x{border:1px solid var(--line);background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer;color:var(--sub)}
.d-nav button:hover,.x:hover{background:var(--soft)}
.d-pos{font-size:12px;color:var(--muted);font-weight:600}
.d-body{padding:20px 22px 28px;overflow-y:auto;flex:1}
.d-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--sub)}
.d-num{border-radius:12px;padding:18px 18px 16px;margin-bottom:16px}
.d-num .v{font-size:40px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.d-num .l{font-size:13px;font-weight:600;margin-top:6px;opacity:.85}
.d-title{font-size:20px;font-weight:800;line-height:1.4;letter-spacing:-.4px;margin-bottom:14px}
.d-sec{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin:18px 0 8px}
.d-pts{list-style:none;display:flex;flex-direction:column;gap:10px}
.d-pts li{font-size:15px;line-height:1.6;padding-left:16px;position:relative;color:#1f2937}
.d-pts li::before{content:"";position:absolute;left:2px;top:10px;width:6px;height:6px;border-radius:2px;background:var(--ink)}
.d-why{font-size:14.5px;line-height:1.65;color:#1f2937;background:var(--soft);border-radius:10px;padding:12px 14px}
.d-co{display:flex;gap:6px;flex-wrap:wrap}
.d-co span{font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:3px 9px}
.d-go{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:22px;padding:13px;border-radius:10px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.d-go:hover{opacity:.9}
.d-src{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;word-break:break-all}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
</style>
<style id="tnb-mobile">

const ORDER=N.slice().sort((a,b)=>b.w-a.w);
const SCALE=[[-3,"#d6203a"],[-2.4,"#e2485a"],[-1.8,"#ec8591"],[-1.2,"#f3b4bc"],[-0.6,"#f8d8dc"],[0,"#e3e5ea"],[0.6,"#d5f0e8"],[1.2,"#b4e4d7"],[1.8,"#87d4c0"],[2.4,"#4fc0a3"],[3,"#17a688"]];
function col(s){let best=SCALE[0];for(const c of SCALE)if(Math.abs(c[0]-s)<Math.abs(best[0]-s))best=c;return best[1]}
const fmt=s=>(s>0?"+":"")+s.toFixed(1);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const sigName=s=>s>=1?"기회":s<=-1?"리스크":"체크";

  <div class="lb">${SCALE.map(c=>`<span>${c[0]===-3?"≤-3":c[0]===3?"≥3":c[0]}</span>`).join("")}</div>`;

/* tabs */
const TABS=[["all","전체",()=>true],["ai","AI 연관",x=>x.ai],["up","기회",x=>x.s>=1],["down","리스크",x=>x.s<=-1],
 ...Object.entries(CATS).map(([k,n])=>[k,n,x=>x.cat===k])];
let tab="all",view="map";
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=TABS.map(([k,n,f])=>`<button class="tab${k==="all"?" on":""}" data-k="${k}">${n}<span class="c">${N.filter(f).length}</span></button>`).join("");
tabsEl.onclick=e=>{const b=e.target.closest(".tab");if(!b)return;tab=b.dataset.k;tabsEl.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t===b));draw()};
document.getElementById("view").onclick=e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.v;
 document.querySelectorAll("#view button").forEach(x=>x.classList.toggle("on",x===b));draw()};
const list=()=>ORDER.filter(TABS.find(t=>t[0]===tab)[2]);

/* squarified treemap */
function worst(row,s){const sum=row.reduce((a,r)=>a+r.a,0);let mx=-1,mn=Infinity;for(const r of row){mx=Math.max(mx,r.a);mn=Math.min(mn,r.a)}
 return Math.max(s*s*mx/(sum*sum),sum*sum/(s*s*mn))}
function squarify(items,x,y,w,h){const out=[];let rest=items.slice();
 while(rest.length){const short=Math.min(w,h);let row=[rest[0]],i=1;
  while(i<rest.length&&worst(row.concat(rest[i]),short)<=worst(row,short)){row.push(rest[i]);i++}
  const sum=row.reduce((s,r)=>s+r.a,0);
  if(w>=h){const cw=sum/h;let cy=y;for(const r of row){const rh=r.a/cw;out.push({...r,x,y:cy,w:cw,h:rh});cy+=rh}x+=cw;w-=cw}
  else{const rh=sum/w;let cx=x;for(const r of row){const rw=r.a/rh;out.push({...r,x:cx,y,w:rw,h:rh});cx+=rw}y+=rh;h-=rh}
  rest=rest.slice(i)}
 return out}

function drawMap(){
 const el=document.getElementById("map"),W=el.clientWidth,H=el.clientHeight,items=list();
 const tot=items.reduce((s,x)=>s+x.w,0);
 const rects=squarify(items.map(x=>({...x,a:x.w/tot*W*H})),0,0,W,H);
 el.innerHTML=rects.map(r=>{const m=Math.min(r.w,r.h),ks=Math.max(11,Math.min(34,m/5.2,r.w/(r.k.length*0.95))),vs=Math.max(10,ks*.82);
  const showT=r.h>170&&r.w>200,showV=r.h>46;
  return `<div class="tile" data-id="${r.id}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${col(r.s)}" title="${esc(r.t)}">
   ${r.ai&&m>90?'<span class="ai">AI</span>':""}
   <div class="k" style="font-size:${ks}px">${esc(r.k)}</div>
   ${showV?`<div class="v" style="font-size:${vs}px">${esc(r.v)}</div>`:""}
   ${showT?`<div class="t" style="font-size:${Math.min(15,ks*.5)}px">${esc(r.t)}</div>`:""}</div>`}).join("");
}

 ${rows.map(x=>`<tr class="r" data-id="${x.id}"><td class="k">${esc(x.k)}${x.ai?' <span style="font-size:11px;color:var(--muted)">AI</span>':""}</td><td><b>${esc(x.v)}</b></td>
  <td><span class="pill" style="background:${col(x.s)}">${fmt(x.s)}</span></td><td class="hide-m">${CATS[x.cat]}</td><td class="hide-m hl">${esc(x.t)}</td></tr>`).join("")}</tbody></table>`;
}

 document.getElementById("mapWrap").hidden=view!=="map";document.getElementById("tblWrap").hidden=view!=="table";
 view==="map"?drawMap():drawTable();
}

/* drawer */
let cur=null;
const dr=document.getElementById("drawer"),dim=document.getElementById("dim");
function open(id){
 const seq=list(),i=seq.findIndex(x=>x.id===id),x=seq[i];cur={id,seq};
 document.getElementById("pos").textContent=`${i+1} / ${seq.length}`;
 const dark=Math.abs(x.s)>=2.4;
 document.getElementById("dbody").innerHTML=`
  <div class="d-meta"><span class="chip">${CATS[x.cat]}</span><span class="chip" style="background:${col(x.s)};color:${dark?"#fff":"inherit"}">${sigName(x.s)} ${fmt(x.s)}</span>${x.ai?'<span class="chip">AI 연관</span>':""}</div>
  <div class="d-num" style="background:${col(x.s)};color:${dark?"#fff":"#10202b"}"><div class="v">${esc(x.v)}</div><div class="l">${esc(x.k)} · ${esc(x.l)}</div></div>
  <div class="d-title">${esc(x.t)}</div>
  <div class="d-sec">핵심 내용</div>
  <ul class="d-pts">${x.p.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>
  <div class="d-sec">TNBfolio 코멘트</div>
  <div class="d-why">${esc(x.why)}</div>
  <div class="d-sec">관련</div>
  <div class="d-co">${x.co.map(c=>`<span>${esc(c)}</span>`).join("")}</div>
  <a class="d-go" href="${x.u}" target="_blank" rel="noopener">${esc(x.src)} 원문 기사 열기 ↗</a>
  <div class="d-src">${esc(x.u.replace(/^https?:\/\/(www\.)?/,""))}</div>`;
 document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===seq.length-1;
 dr.classList.add("on");dim.classList.add("on");dr.setAttribute("aria-hidden","false");document.getElementById("dbody").scrollTop=0;
}
function close(){dr.classList.remove("on");dim.classList.remove("on");dr.setAttribute("aria-hidden","true");cur=null}
function step(d){if(!cur)return;const i=cur.seq.findIndex(x=>x.id===cur.id)+d;if(i>=0&&i<cur.seq.length)open(cur.seq[i].id)}
document.getElementById("map").onclick=e=>{const t=e.target.closest(".tile");if(t)open(+t.dataset.id)};
document.getElementById("tblWrap").onclick=e=>{const t=e.target.closest("tr.r");if(t)open(+t.dataset.id)};
document.getElementById("close").onclick=close;dim.onclick=close;
document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);
document.addEventListener("keydown",e=>{if(!cur)return;if(e.key==="Escape")close();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});

draw();
