{t:"삼화콘덴서 및 삼성전기, AI 서버 폭증으로 고용량 MLCC 납기 52주까지 급증",b:[

{t:"Murata, 실장 면적 60% 축소한 세계 최소형 NTC 서미스터 개발 및 2027년 양산 계획",b:[

{t:"Groq, AI 모델 대형화 대응 위해 차세대 LPU 메모리를 SRAM에서 3D 적층 DRAM으로 전면 전환",b:[
"Nvidia가 인수한 Groq가 차세대 LPU 메모리를 온칩 SRAM에서 TSV 기반 3D 적층 DRAM으로 바꾼다.",

"업계는 용량 우선으로 전환한 Groq 기술이 Vera Rubin 추론 인프라에 통합될 것으로 본다."],

{t:"Omdia, 차세대 와이드 폴더블 수요 확대에 힘입어 올해 폴더블 패널 출하량 44% 급증 전망",b:[

{t:"Eric Schmidt 전 Google CEO, 중국 오픈웨이트 모델의 저비용 경쟁력 바탕 AI 주도권 경고",b:[
"Schmidt는 중국 AI가 미국에 6개월 뒤처져 있지만 저렴한 오픈웨이트 모델로 개도국 점유율을 잠식하며 사실상 앞서고 있다고 평가했다.",

{t:"CrowdStrike, NVIDIA와 협력해 AI 에이전트 보안을 소프트웨어에서 반도체 실리콘 계층으로 확장",b:[

{t:"Aptiv, NVIDIA 협업 확대로 공랭식 Thor 기반 보급형 자율주행 플랫폼 상용화 가속",b:[

{t:"Anthropic, 음악 출판사들이 제기한 가사 저작권 소송서 공정 이용 법리 공방 본격화",b:[

{t:"글로벌 투자자, AI 부채 버블 우려 확산에 신용부도스왑(CDS) 매수 급증",b:[
"AI 인프라 부채 급증으로 9월 Oracle·Nvidia·Alphabet·Meta 등 빅테크 연계 CDS 주간 거래액이 90억 달러를 넘었다.",
"주요 AI 채무자들의 CDS 스프레드가 사상 최고치를 경신했고, CoreWeave 5년물은 1,090bp로 부실채권 영역에 진입했다.",
"풋옵션보다 저렴한 헤지 수단으로 CDS 수요가 몰리며 버블 붕괴 공포를 반영하고 있다."],
u:"https://www.ft.com/content/6dd31584-064c-4015-bf5d-e5747799ccd5?shareType=nongift&syn-25a6b1a6=1"},
{t:"일본은행 전 이사, 안정적 물가 통제 위해 분기당 한 차례 금리 인상 적절성 피력",b:[
"Eiji Maeda 전 BOJ 이사는 분기당 1회 금리 인상이 타당하다며 12월에 이어 2027년 3월 또는 4월 인상 가능성을 전망했다.",
"6월과 9월 인상은 1990년 이후 가장 빠른 긴축 속도였고, 기준금리는 중립금리 범위 1.1~2.5%에 안착하고 있다.",
"최종 금리는 2.25%까지 오를 수 있으며 정책 소통 난도가 높아질 것이라고 경고했다."],
u:"https://www.bloomberg.com/news/articles/2026-10-21/boj-likely-to-keep-hiking-rates-every-quarter-ex-official-says"},
{t:"Goldman Sachs, 인도 AI 스타트업 상장 활성화 시 증시 시총 1,000억 달러 증가 전망",b:[
"Goldman Sachs는 인도 비상장 AI 기업들의 IPO로 현지 증시 시총이 최대 1,000억 달러 늘어날 수 있다고 분석했다.",
"중후기 단계 71개사의 기업가치는 총 540억 달러이며, 이 중 25~50%가 2~5년 내 상장하면 대규모 자금 유입이 예상된다.",
"인도 AI 스타트업 사모 투자는 2024년 16억 달러에서 2026년 50억 달러를 넘어섰다."],
u:"https://www.thehindubusinessline.com/markets/indias-listed-ai-market-could-gain-100-billion-from-ipos-says-goldman-sachs/article71606351.ece"},
{t:"Larry Ellison, 아들의 Warner Bros. 인수 자금 조달을 위해 주식 담보 대출 확대",b:[
"Ellison은 아들의 Warner Bros. Discovery 인수 지원을 위해 75억 달러 주식 매각 계획을 철회하고 담보 대출을 택했다.",
"Oracle·Tesla·SpaceX·Paramount 주식을 담보로 글로벌 은행 5곳의 대출 한도를 늘렸고, 담보 Oracle 주식은 3,000만 주에서 8,700만 주로 늘었다.",
"양도소득세를 피하면서 자산 지배력을 그대로 유지하는 방식이다."],
u:"https://www.wsj.com/finance/larry-ellison-warner-bros-loans-49918714"}
]},

{t:"미국 에너지부, 디젤 가격 급등세 완화 위해 국내외 정유업계 증산 설득 착수",b:[
"이란 전쟁과 러시아 정유시설 피격으로 미국 소매 디젤 가격이 갤런당 6.32달러로 치솟자 에너지부가 정유업계 증산 협의에 나섰다.",
"미국 정유 가동률이 이미 95~100%여서 행정부는 DPA 적용과 인도 등 해외 정유업체 협력을 동시에 추진한다.",
"IEA는 회원국과 함께 2,000만 배럴 이상의 디젤 비축유를 방출하기로 합의했다."],
u:"https://www.reuters.com/business/energy/us-energy-department-official-says-working-with-refiners-producing-more-diesel-2026-10-20/"},
{t:"Marco Rubio 미국 국무장관, 글로벌 디젤 공급 확대를 위해 인도 Jamnagar 초대형 정유소 방문",b:[
"Rubio 국무장관이 중간선거를 앞두고 디젤 가격 안정을 위해 릴라이언스의 Jamnagar 정유 단지를 방문한다.",
"Jamnagar의 디젤 크랙 스프레드는 배럴당 63달러로 전쟁 이전의 3배 수준까지 올랐다.",
"미국은 러시아산 대신 베네수엘라산 원유 확대를 유도하고 있으며, 양국은 관세 인하 무역 협정 타결을 앞두고 있다."],
u:"https://www.ft.com/content/e316142e-c315-47d4-89c9-971bad5a6380?syn-25a6b1a6=1"},
{t:"중동 원유 시장, 대체 운송로를 통한 수출 회복 속 유가 반락",b:[
"Kpler에 따르면 우회 파이프라인 활용으로 걸프만 원유 수출이 일일 2,400만 배럴을 넘어 전쟁 이전 수준을 회복했다.",
"사우디·UAE의 내륙 송유관 가동으로 호르무즈 우회 비중이 17%에서 40%로 늘었고, 브렌트유는 0.3% 내린 108.42달러에 마감했다.",
"정제유 수출은 여전히 전쟁 전을 크게 밑돌아 제품 시장의 타이트한 수급은 지속됐다."],
u:"https://www.wsj.com/business/energy-oil/oil-prices-rise-as-hormuz-shipping-risks-persist-7df58bc8"},
{t:"글로벌 정유 시장, 트럼프 대통령의 대러 합의에도 불구하고 제한적 물량으로 경유 강세 지속 전망",b:[
"트럼프-러시아 디젤 공급 합의의 1차 물량은 30만 톤 수준에 불과해 가격 억제 효과는 미미할 것이란 분석이다.",
"러시아 정유시설 45%가 가동 중단이고 흑해 운임이 급등해 수출을 단기간에 늘리기 어렵다.",
"제재 잔존으로 선사들이 러시아산 운송을 기피하고 있어, 갤런당 6달러를 넘는 경유 가격은 공화당에 정치적 부담이 되고 있다."],
u:"https://www.reuters.com/business/energy/global-diesel-prices-seen-staying-high-despite-trumps-deal-with-russia-2026-10-21/"}
]},
{s:"통신 서비스",c:"#0F7C8C",items:[
{t:"Nvidia, 유럽 주요 통신사들과 손잡고 소버린 AI 팩토리 및 AI-RAN 생태계 확장",b:[
"Nvidia가 도이치텔레콤·BT·오렌지 등과 손잡고 유럽 내 1,500개 이상의 엣지 데이터센터를 활용한 분산형 AI 공장을 구축한다.",
"도이치텔레콤은 산업용 AI 클라우드를, 엘리사는 AI-RAN 시범 서비스를, 오렌지는 음성 지능형 서비스를 추진한다.",
"통신사 인프라에 Nvidia 가속기를 결합해 유럽 데이터 주권형 기업 AI 시장을 선점하겠다는 구상이다."],
u:"https://www.sdxcentral.com/news/nvidia-wants-to-turn-europes-telcos-into-sovereign-ai-factories/"}
]},
{s:"헬스케어",c:"#2E7D52",items:[
{t:"Moderna, 맞춤형 암 백신 임상 3상 전체 데이터 마드리드 학회서 공개 예정",b:[
"Moderna·Merck가 Keytruda와 병용하는 맞춤형 mRNA 암 백신 intismeran의 3상 전체 데이터를 이번 주말 마드리드에서 발표한다.",
"8월 1·2차 평가변수 충족 발표 이후 Moderna 주가는 284% 급등했고, 시장은 무재발 생존율 위험비에 주목하고 있다.",
"회사는 흑색종을 넘어 방광암·신세포암·비소세포폐암으로의 확장을 기대한다."],
u:"https://www.marketwatch.com/story/moderna-is-about-to-release-the-trial-results-for-its-cancer-vaccine-a-lot-is-riding-on-this-data-ccbf8c9c"},
{t:"OpenEvidence, 의사들의 자발적 AI 검색 도입으로 기업가치 150억 달러 돌파",b:[
"미국 의사 3분의 2가 진료·처방에 활용하면서 OpenEvidence가 150억 달러 기업가치를 인정받았다.",
"광고 매출은 2026년 말까지 최대 5억 달러에 달할 전망이며, EMR 연동과 신약 개발용 문헌 분석으로 사업을 넓히고 있다.",
"과도한 AI 의존 위험과 범용 모델 대비 낮은 벤치마크 성능은 논쟁거리로 남아 있다."],
u:"https://www.ft.com/content/0ed17b79-47dd-4ad8-8dca-44eb35617edc?syn-25a6b1a6=1"},
{t:"Loyal, 노령견 건강 수명 연장 알약 LOY-002의 FDA 조건부 승인 요건 2건 통과",b:[
"Loyal의 반려견 수명 연장 후보물질 LOY-002가 FDA 조건부 승인을 위한 안전성·약효 기대 근거 심사를 통과했다.",
"10세 이상·14파운드 이상 노령견의 인슐린 저항성을 개선해 대사 노화를 억제하도록 설계됐다.",
"제조 품질 검토가 끝나면 조건부 승인으로 처방이 가능해지며, 1,300마리 이상 대상 이중맹검 임상이 진행 중이다."],
u:"https://www.consumeraffairs.com/news/a-pill-to-help-dogs-live-longer-moves-closer-to-fda-approval-102126.html"},
{t:"Syntax Bio, 줄기세포를 4일 만에 췌장 베타세포 상태로 분화시키는 플랫폼 데이터 공개",b:[
"Syntax Bio가 CRISPRa 기반 Cellgorithm 플랫폼으로 유도만능줄기세포를 4일 만에 베타세포 상태로 유도했다.",
"게놈 절단 없이 29개 췌장 분화 유전자 중 최대 10개를 순차 통제해 베타 유사 세포로 분화시켰다.",
"Breakthrough T1D 지원과 Mayo Clinic 협력으로 제1형 당뇨병 치료제의 전임상과 상용화를 추진한다."],
u:"https://www.biospace.com/press-releases/syntax-bio-programs-stem-cells-toward-pancreatic-beta-cells-in-four-days"},
{t:"Novo Nordisk, 차세대 비만 치료제 카그리세마로 여성 환자서 25% 체중 감량 효과 확인",b:[
"3상 사후 분석에서 카그리세마를 투여한 비만 여성 2,309명이 평균 25%의 체중을 감량했다.",
"폐경 전 26.7%, 주폐경기 24.8%, 폐경 후 23.1%로 폐경 단계에 따라 감량률에 차이가 있었다.",
"Eli Lilly의 레타트루타이드와 치열한 시장 경쟁이 예상된다."],
u:"https://www.biospace.com/drug-development/novos-cagrisema-achieves-25-weight-loss-in-women-driven-by-younger-patients"},
{t:"Merck, 희귀 종양 환자 지원을 위해 NVIDIA 및 Microsoft와 협력 모델 구축",b:[
"Merck가 NVIDIA·Microsoft·Dawn Health와 함께 데스모이드 종양·NF1-PN 환자를 위한 24시간 AI 환자 지원 프로그램을 구축한다.",
"Nemotron, NeMo Guardrails와 Azure 인프라를 기반으로 응급 에스컬레이션과 추적성을 갖춘 시스템을 만든다.",
"기술 검증 후 유럽 주요 시장에서 시범 운영할 예정이다."],
u:"https://www.businesswire.com/news/home/20261020304233/en/Merck-Collaborates-with-NVIDIA-Microsoft-and-Dawn-Health-to-Develop-Novel-Support-Model-for-People-Living-with-Rare-Tumors"},
{t:"GSK, 만성 B형 간염 환자 대상 안티센스 혁신 신약 Hibsago의 미국 FDA 정식 승인 획득",b:[
"FDA가 간경변 없는 성인 만성 B형 간염 환자용 안티센스 치료제 Hibsago를 3상 B-Well 결과를 바탕으로 승인했다.",
"바이러스 RNA 증식을 억제하고 HBsAg를 낮추며, 6개월 투약으로 저항원 환자군에서 최대 26%의 기능적 완치율을 보였다.",
"8월 일본 승인에 이어 미국 허가까지 얻으며 B형 간염 치료 시장에 새 전기를 마련했다."],
u:"https://kalkinemedia.com/uk/news/announcements/gsk-secures-fda-approval-for-hibsago-bepirovirsen-to-treat-chronic-hepatitis-b-in-us-adults"}
]},
{s:"정치",c:"#8B1E3F",items:[
{t:"미국 국무부, 후티 반군 공격 격화에 사우디 주재 외교관 출국 명령 발령",b:[
"후티 반군의 리야드 공항 등 민간 목표물 공격이 격화되자 미 국무부가 사우디 주재 비필수 인력과 가족에게 출국을 명령했다.",
"철수 조치는 다른 걸프 국가 공관 가족으로도 확대될 예정이다.",
"미국·이스라엘과 이란 간 분쟁으로 중동 전선이 확대되며 에너지 수송로 교란이 가중되고 있다."],
u:"https://www.reuters.com/world/middle-east/us-preparing-issue-ordered-departure-some-personnel-gulf-embassies-us-officials-2026-10-21/"},
{t:"미국 공화당, 선거구 재조정 전략이 트럼프 대통령 지지율 침체로 위기 직면",b:[
"공화당이 텍사스·플로리다 등에서 재조정한 16개 지역구 중 9곳이 민주당 우세 또는 초박빙 경합으로 바뀌었다.",
"이란 전쟁 장기화와 유가 급등에 따른 트럼프 지지율 하락이 히스패닉 표심 이탈을 불렀다.",
"공화당 외곽 단체들은 재조정 선거구 4곳에 후보당 평균 1,200만 달러 이상을 투입하고 있다."],
u:"https://www.reuters.com/world/us/how-republican-redistricting-gambit-faltered-under-trump-slump-2026-10-21/"},
{t:"Zelenskiy 우크라이나 대통령, 미국·러시아와의 종전 3자 회담 및 휴전 지지 입장 표명",b:[
"Zelenskiy 대통령은 Witkoff 특사의 모스크바 방문에 기대를 보이며 미국·러시아와의 3자 종전 협상과 트럼프의 휴전 촉구를 지지했다.",
"미국의 군사 정보 공유 복원에 감사하면서도 Starshield 서비스 제약 해제를 요구했다.",
"미 국무부는 Starlink·Starshield 접근 제한 권한이 백악관이 아닌 Elon Musk에게 있다고 밝혔다."],
u:"https://www.reuters.com/world/europe/ukraines-zelenskiy-says-he-supports-ceasefire-trilateral-talks-with-us-russia-2026-10-21/"},
{t:"미국 정부, 이스라엘 정보 바탕으로 대이란 선제 타격 찬성으로 입장 급선회",b:[
"Haaretz는 Hegseth 국방장관이 Netanyahu와 면담 후 새 기밀 정보를 보고하면서 미국이 대이란 선제 타격 지지로 선회했다고 보도했다.",
"이스라엘 공군은 10월 27일 총선을 앞두고 이란 국경 인근에서 무력 시위 비행을 벌였으며, 반격을 유도하려 했다는 관측이 나왔다.",
"일부 외신은 미군이 이미 이란 남부 시리크를 공습했을 가능성을 미확인 보도했다."],
u:"https://breakingthenews.net/Article/US-said-to-change-stance-favor-preemptive-Iran-strike/67369672"},

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const total = DATA.reduce((n,d)=>n+d.items.length,0);
document.getElementById("total").textContent = total;

const filters = document.getElementById("filters");
const list = document.getElementById("list");
let active = "전체";

function renderFilters(){
  const all = [{s:"전체",n:total}].concat(DATA.map(d=>({s:d.s,n:d.items.length})));
  filters.innerHTML = all.map(f=>`<button class="chip${f.s===active?" on":""}" data-s="${f.s}">${f.s}<span>${f.n}</span></button>`).join("");
  filters.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{active=b.dataset.s;renderFilters();renderList();window.scrollTo({top:0,behavior:"smooth"});});
}
function renderList(){
  list.innerHTML = DATA.filter(d=>active==="전체"||d.s===active).map(d=>`
    <section>
      <div class="sec-head"><span class="bar" style="background:${d.c}"></span><h2>${d.s}</h2><span class="cnt">${d.items.length}건</span></div>
      ${d.items.map((it,i)=>`
        <article class="card" style="--c:${d.c}">
          <h3><span class="no">${String(i+1).padStart(2,"0")}</span><span>${esc(it.t)}</span></h3>
          <ul>${it.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
          <a href="${it.u}" target="_blank" rel="noopener">${esc(it.u)}</a>
        </article>`).join("")}
    </section>`).join("");
}
renderFilters(); renderList();
</script>
