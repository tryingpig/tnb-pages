    function extractDomain(url) {
      try {
        const u = new URL(url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return url;
      }
    }

    function determineTag(title, sector) {
      const t = title.toLowerCase();
      if (t.includes('ai') || t.includes('인공지능') || t.includes('llm')) return { label: 'AI', class: 'badge-blue' };
      if (t.includes('로봇') || t.includes('휴머노이드')) return { label: '로봇', class: 'badge-green' };
      if (t.includes('반도체') || t.includes('hbm') || t.includes('dram') || t.includes('메모리') || t.includes('낸드') || t.includes('웨이퍼')) return { label: '반도체', class: 'badge-blue' };
      if (t.includes('하락') || t.includes('폭락') || t.includes('급락') || t.includes('경고') || t.includes('위기')) return { label: '경고', class: 'badge-red' };
      if (t.includes('ipo') || t.includes('상장')) return { label: 'IPO', class: 'badge-gold' };
      if (t.includes('투자') || t.includes('펀드') || t.includes('계약')) return { label: '투자', class: 'badge-green' };
      if (t.includes('원자력') || t.includes('smr')) return { label: '원자력', class: 'badge-green' };
      if (t.includes('지정학') || t.includes('전쟁') || t.includes('군사') || t.includes('이란')) return { label: '지정학', class: 'badge-red' };
      if (t.includes('배터리') || t.includes('ev') || t.includes('전기차')) return { label: '배터리/EV', class: 'badge-green' };
      
      const conf = sectorConfig[sector] || { color: '#6B6B67' };
      return { label: sector.slice(0, 4), class: 'badge-gold' };
    }

            <span>${cfg.emoji}</span>
            <h2 class="sector-title">${sector}</h2>
            <span class="sector-count">(${items.length}건)</span>
          </div>
          <div class="news-grid">
            ${cardsHtml}
          </div>
        </section>
      `;
    });

    const filterBtns = document.querySelectorAll('.filter-btn');
    const sections = document.querySelectorAll('.sector-section');
    const chartsContainer = document.getElementById('chartsContainer');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const filter = btn.getAttribute('data-filter');

        if (filter === 'all') {
          chartsContainer.style.display = 'grid';
          sections.forEach(sec => sec.style.display = 'block');
        } else {
          chartsContainer.style.display = 'none';
          sections.forEach(sec => {
            if (sec.getAttribute('data-sector') === filter) {
              sec.style.display = 'block';
            } else {
              sec.style.display = 'none';
            }
          });
        }
      });
    });

    function executeDownload() {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'TNBfolio_뉴스대시보드_20260907.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    document.getElementById('manualDownloadBtn').addEventListener('click', executeDownload);

    
  </script>
</body>
</html>
